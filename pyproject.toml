[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cohalign"
version = "1.9.1"
description = "First-order noise susceptibility of the ensemble gradient second moment in equivariant quantum neural networks"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Hassan Ugail" },
  { name = "Newton Howard" },
]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["cohalign"]
